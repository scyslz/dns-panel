name: Release on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Tag（例如 v1.7.1，需已存在）'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_NAME: scyslz/dns-panel

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # 多架构 Docker 镜像 -> Docker Hub
  docker:
    name: Build & Push Docker (amd64 + arm64)
    needs: quality
    runs-on: ubuntu-latest
    environment: docker hub
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-push
          cache-to: type=gha,mode=max,scope=docker-push

  # 可直接运行的发布包（服务端 dist + 前端静态资源 + prisma）
  bundle:
    name: Build Release Bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="release-stage"
          ASSETS="release-assets"
          rm -rf "$STAGE" "$ASSETS"
          mkdir -p "$STAGE" "$ASSETS"

          cp -r server/dist "$STAGE/dist"
          cp -r client/dist "$STAGE/public"
          cp -r server/prisma "$STAGE/prisma"
          cp server/package.json server/package-lock.json "$STAGE/"
          mkdir -p "$STAGE/data"

          tar -czf "$ASSETS/dns-panel-${VERSION}-bundle.tar.gz" -C "$STAGE" \
            dist public prisma package.json package-lock.json data

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error

  # 每个架构的离线 Docker 镜像包
  docker-archives:
    name: Docker archive (${{ matrix.arch }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p release-assets
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file ./Dockerfile \
            --output type=docker,dest="dns-panel-${ARCH}.tar" \
            --cache-from type=gha,scope=docker-arch-${ARCH} \
            --cache-to type=gha,mode=max,scope=docker-arch-${ARCH} \
            .
          gzip -9 -c "dns-panel-${ARCH}.tar" > "release-assets/dns-panel-${VERSION}-linux-${ARCH}.tar.gz"
          rm -f "dns-panel-${ARCH}.tar"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  # GitHub Release：汇总所有产物 + 自动生成 Release Notes
  github-release:
    name: Create GitHub Release
    needs: [docker, bundle, docker-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Release ${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
